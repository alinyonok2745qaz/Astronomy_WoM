<html lang="ru">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Marcellus&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        'gold-light': '#F3E5AB',
                        'space-dark': '#060814',
                        'parchment': '#1a162b'
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        marcellus: ['Marcellus', 'serif']

    <style>
        body {
            background-color: #04060f;
            color: #f3e5ab;
            font-family: 'Marcellus', serif;
            overflow: hidden;
            user-select: none;
        }

        /* Glassmorphic Parchment Cards */
        .magic-card {
            background: rgba(18, 14, 33, 0.88);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15), inset 0 0 15px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(12px);
        }

        .magic-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(100, 60, 150, 0.3) 100%);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #F3E5AB;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .magic-btn:hover {
            border-color: #D4AF37;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.5), inset 0 0 10px rgba(212, 175, 55, 0.3);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .magic-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .magic-btn:hover::after {
            opacity: 1;
        }

        .magic-btn.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.6) 0%, rgba(180, 120, 20, 0.8) 100%);
            color: #060814;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
        }

        /* Glowing text effects */
        .glow-title {
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.6), 0 0 25px rgba(212, 175, 55, 0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 8, 20, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.8);
        }

        /* Pulse animations */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .pulse-bg {
            animation: pulseGlow 6s infinite ease-in-out;
        }
    </style>
</head>

        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let isConstellationMode = false;
        let drawnLines = []; // User drawn constellation lines: [{fromStar, toStar}]
        let userPoints = []; // Interactive stars
        let activePoint = null;
        let selectedCategory = 'all';

        // Particle Background System
        let bgStars = [];
        const NUM_BG_STARS = 250;

        function initBgStars() {
            bgStars = [];
            for (let i = 0; i < NUM_BG_STARS; i++) {
                bgStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005,
                    twinkle: Math.random() * 0.05
                });
            }
        }

        // Fixed Constellation Points for Drawing
        function initConstellationNodes() {
            userPoints = [];
            const centerX = width / 2;
            const centerY = height / 2;

            // Generate structured starry points
            const starCoords = [
                // Ursa Major pattern offset
                {x: centerX - 250, y: centerY - 150, name: 'Дубхе'},
                {x: centerX - 180, y: centerY - 160, name: 'Мерак'},
                {x: centerX - 140, y: centerY - 100, name: 'Фекда'},
                {x: centerX - 210, y: centerY - 80, name: 'Мегрец'},
                {x: centerX - 120, y: centerY - 40, name: 'Алиот'},
                {x: centerX - 70, y: centerY - 10, name: 'Мицар'},
                {x: centerX - 10, y: centerY + 20, name: 'Алькаид'},

                // Orion pattern offset
                {x: centerX + 150, y: centerY - 180, name: 'Бетельгейзе'},
                {x: centerX + 250, y: centerY - 150, name: 'Беллатрикс'},
                {x: centerX + 180, y: centerY - 70, name: 'Минтака'},
                {x: centerX + 200, y: centerY - 65, name: 'Альнилам'},
                {x: centerX + 220, y: centerY - 60, name: 'Альнитак'},
                {x: centerX + 170, y: centerY + 50, name: 'Саиф'},
                {x: centerX + 260, y: centerY + 40, name: 'Ригель'},

                // Cassiopeia pattern offset
                {x: centerX - 100, y: centerY + 180, name: 'Каф'},
                {x: centerX - 50, y: centerY + 140, name: 'Шедар'},
                {x: centerX, y: centerY + 170, name: 'Нави'},
                {x: centerX + 60, y: centerY + 130, name: 'Рукбах'},
                {x: centerX + 110, y: centerY + 160, name: 'Сегин'}
            ];

            starCoords.forEach((st, idx) => {
                userPoints.push({
                    id: idx,
                    x: st.x,
                    y: st.y,
                    name: st.name,
                    radius: 4,
                    glow: Math.random() * Math.PI
                });
            });
        }

        // Orbit Angles State for Planets
        let orbits = {};
        Object.keys(ASTRONOMY_DATA).forEach(key => {
            orbits[key] = Math.random() * Math.PI * 2;
        });

        // RE-SIZE HANDLER
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBgStars();
            initConstellationNodes();
        });

        // --- ANIMATION LOOP ---
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Space Background (Deep Cosmic Gradient)
            const bgGradient = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, Math.max(width, height));
            bgGradient.addColorStop(0, '#0a0d24');
            bgGradient.addColorStop(0.6, '#050716');
            bgGradient.addColorStop(1, '#020308');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // 2. Render Twinkling Background Stars
            bgStars.forEach(star => {
                star.alpha += Math.sin(star.twinkle) * 0.015;
                star.twinkle += star.speed;
                ctx.fillStyle = `rgba(255, 245, 210, ${Math.abs(Math.sin(star.alpha))})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            const centerX = width / 2;
            const centerY = height / 2;

            if (!isConstellationMode) {
                // --- 3D / ORBITAL CELESTIAL BODIES MODE ---

                // Draw Orbits
                Object.values(ASTRONOMY_DATA).forEach(obj => {
                    if (obj.orbitRadius > 0) {
                        const isVisible = selectedCategory === 'all' || obj.category === selectedCategory;
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, obj.orbitRadius, 0, Math.PI * 2);
                        ctx.strokeStyle = isVisible ? 'rgba(212, 175, 55, 0.15)' : 'rgba(255, 255, 255, 0.03)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 4]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                });

                // Update & Draw Celestial Bodies
                Object.values(ASTRONOMY_DATA).forEach(obj => {
                    const isVisible = selectedCategory === 'all' || obj.category === selectedCategory;
                    
                    // Update angle
                    orbits[obj.id] += obj.speed;
                    const angle = orbits[obj.id];

                    let x = centerX;
                    let y = centerY;

                    if (obj.orbitRadius > 0) {
                        x = centerX + Math.cos(angle) * obj.orbitRadius;
                        y = centerY + Math.sin(angle) * obj.orbitRadius;
                    }

                    obj.currentX = x;
                    obj.currentY = y;

                    // Draw Saturn Rings
                    if (obj.hasRings && isVisible) {
                        ctx.save();
                        ctx.translate(x, y);
                        ctx.rotate(0.4);
                        ctx.beginPath();
                        ctx.ellipse(0, 0, obj.radius * 2.2, obj.radius * 0.7, 0, 0, Math.PI * 2);
                        ctx.strokeStyle = 'rgba(227, 193, 143, 0.6)';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                        ctx.restore();
                    }

                    // Render Glowing Body
                    ctx.beginPath();
                    ctx.arc(x, y, obj.radius, 0, Math.PI * 2);
                    
                    // Body Color Gradient
                    const glow = ctx.createRadialGradient(x, y, obj.radius * 0.2, x, y, obj.radius * 1.8);
                    glow.addColorStop(0, '#ffffff');
                    glow.addColorStop(0.5, obj.color);
                    glow.addColorStop(1, 'transparent');

                    ctx.fillStyle = isVisible ? glow : 'rgba(100,100,100,0.2)';
                    ctx.fill();

                    // Comet Tail Special Effect
                    if (obj.id === 'comet' && isVisible) {
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x - Math.cos(angle) * 45, y - Math.sin(angle) * 45);
                        ctx.strokeStyle = 'rgba(136, 227, 238, 0.4)';
                        ctx.lineWidth = 6;
                        ctx.stroke();
                    }

                    // Text Label
                    if (isVisible) {
                        ctx.font = '11px Cinzel, serif';
                        ctx.fillStyle = 'rgba(243, 229, 171, 0.85)';
                        ctx.textAlign = 'center';
                        ctx.fillText(obj.name.split(' ')[0], x, y + obj.radius + 14);
                    }
                });

            } else {
                // --- CONSTELLATION DRAWING MODE ---

                // Render User Drawn Lines
                ctx.strokeStyle = '#D4AF37';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#D4AF37';
                ctx.shadowBlur = 10;

                drawnLines.forEach(line => {
                    ctx.beginPath();
                    ctx.moveTo(line.from.x, line.from.y);
                    ctx.lineTo(line.to.x, line.to.y);
                    ctx.stroke();
                });
                ctx.shadowBlur = 0; // reset

                // Render Interactive Constellation Stars
                userPoints.forEach(pt => {
                    pt.glow += 0.05;
                    const glowSize = pt.radius + Math.sin(pt.glow) * 2;

                    // Glow halo
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, glowSize * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(212, 175, 55, 0.2)';
                    ctx.fill();

                    // Core star
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, glowSize, 0, Math.PI * 2);
                    ctx.fillStyle = (activePoint === pt) ? '#ffffff' : '#F3E5AB';
                    ctx.fill();

                    // Star name
                    ctx.font = '10px Marcellus, serif';
                    ctx.fillStyle = 'rgba(212, 175, 55, 0.7)';
                    ctx.textAlign = 'center';
                    ctx.fillText(pt.name, pt.x, pt.y - 10);
                });
            }

            requestAnimationFrame(animate);
        }

        // --- INTERACTION HANDLERS ---

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (!isConstellationMode) {
                // Click Celestial Body
                Object.values(ASTRONOMY_DATA).forEach(obj => {
                    const isVisible = selectedCategory === 'all' || obj.category === selectedCategory;
                    if (!isVisible) return;

                    const dist = Math.hypot(mouseX - obj.currentX, mouseY - obj.currentY);
                    if (dist < obj.radius + 12) {
                        openModal(obj);
                    }
                });
            } else {
                // Click Stars to Connect Lines
                let clickedStar = userPoints.find(pt => Math.hypot(mouseX - pt.x, mouseY - pt.y) < 20);

                if (clickedStar) {
                    if (!activePoint) {
                        activePoint = clickedStar;
                        showToast(`Начальная звезда: ${clickedStar.name}. Кликните по следующей звезде.`);
                    } else if (activePoint !== clickedStar) {
                        // Add Line
                        drawnLines.push({ from: activePoint, to: clickedStar });
                        createSparkleEffect(clickedStar.x, clickedStar.y);
                        showToast(`Соединено: ${activePoint.name} ➔ ${clickedStar.name}`);
                        activePoint = clickedStar;

                        // Check if user has drawn several lines
                        if (drawnLines.length >= 4) {
                            triggerMagicConstellationUnlock();
                        }
                    }
                }
            }
        });

        // SPARKLE PARTICLES EFFECT
        function createSparkleEffect(x, y) {
            for (let i = 0; i < 12; i++) {
                bgStars.push({
                    x: x + (Math.random() - 0.5) * 30,
                    y: y + (Math.random() - 0.5) * 30,
                    size: Math.random() * 3 + 1,
                    alpha: 1,
                    speed: 0.05,
                    twinkle: 0.1
                });
            }
        }

        // TRIGGER CONSTELLATION LECTURE CARD
        function triggerMagicConstellationUnlock() {
            const randomConst = CONSTELLATIONS_INFO[Math.floor(Math.random() * CONSTELLATIONS_INFO.length)];
            
            setTimeout(() => {
                const constObj = {
                    name: `Созвездие: ${randomConst.name}`,
                    icon: '✨',
                    subtitle: 'Созвездие распознано • Лекционный разбор',
                    content: `
                        <div class="text-center my-2">
                            <i class="fa-solid fa-star text-gold text-3xl animate-spin"></i>
                        </div>
                        <p class="mb-3">${randomConst.desc}</p>
                        <div class="bg-black/40 border-l-2 border-gold p-3 rounded-r-lg">
                            <h4 class="font-cinzel text-gold text-xs font-bold mb-1">МАГИЧЕСКИЙ СОВЕТ АСТРОНОМА:</h4>
                            <p class="text-xs">Рисование линий соединяет ментальные точки с древними звездами, подпитывая палочку звёздной пыльцой и улучшая точные чары направления (Укажи мне).</p>
                        </div>
                    `
                };
                openModal(constObj);
            }, 600);
        }

        // MODE TOGGLE
        function toggleConstellationMode() {
            isConstellationMode = !isConstellationMode;
            const btn = document.getElementById('modeToggleBtn');
            const btnText = document.getElementById('modeBtnText');
            const clearBtn = document.getElementById('clearLinesBtn');
            const guideBtn = document.getElementById('guideBtn');

            if (isConstellationMode) {
                btn.classList.add('active');
                btnText.textContent = 'Режим: Небосвод (3D)';
                clearBtn.classList.remove('hidden');
                guideBtn.classList.remove('hidden');
                showToast('Соединяйте звёзды от руки, чтобы составить созвездия!');
            } else {
                btn.classList.remove('active');
                btnText.textContent = 'Режим: Созвездия';
                clearBtn.classList.add('hidden');
                guideBtn.classList.add('hidden');
                showToast('Нажатие на планеты открывает свитки с лекциями');
            }
        }

        function clearConstellationLines() {
            drawnLines = [];
            activePoint = null;
            showToast('Линии созвездий очищены');
        }

        function showConstellationGuide() {
            const guideObj = {
                name: 'Руководство по Созвездиям',
                icon: '📜',
                subtitle: 'Лекция о звёздных картах',
                content: `
                    <p class="mb-3">В Астрономии WoM созвездия — это не просто узоры, а звёздные каркасы магии. Соединяя звёзды линии за линией, астроном настраивается на вибрацию космоса.</p>
                    <ul class="list-disc list-inside space-y-2 text-xs">
                        <li><b>Большая Медведица:</b> 7 звёзд слева сверху.</li>
                        <li><b>Орион:</b> Группа звёзд справа с выраженным поясом.</li>
                        <li><b>Кассиопея:</b> Зигзагообразная «W» снизу.</li>
                    </ul>
                `
            };
            openModal(guideObj);
        }

        // CATEGORY FILTER
        function selectCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.nav-cat-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            if (isConstellationMode) {
                toggleConstellationMode(); // Return to solar system mode
            }
        }

        // MODAL DISPLAY LOGIC
        function openModal(data) {
            document.getElementById('modalTitle').textContent = data.name;
            document.getElementById('modalSubtitle').textContent = data.subtitle || 'Лекция по Астрономии WoM';
            document.getElementById('modalIconContainer').textContent = data.icon || '🪐';
            document.getElementById('modalBody').innerHTML = data.content;
            
            document.getElementById('infoModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('hidden');
        }

        function showToast(text) {
            const toastText = document.getElementById('instructionText');
            toastText.textContent = text;
        }

        // INITIALIZATION
        window.onload = function() {
            initBgStars();
            initConstellationNodes();
            animate();
        };
    </script>
</body>
</html>
